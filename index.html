<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Questões</title>
  <style>
    :root {
      --bg-color: #0b0b0e;
      --card-bg: #111116;
      --card-border: #1e1e26;
      --option-bg: #15151c;
      --option-border: #23232f;
      --letter-box-bg: #1f1f2a;
      
      --text-main: #f1f1f5;
      --text-muted: #808098;
      --accent-color: #facc15;
      --primary: #6366f1;
      
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.12);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --green-cmd: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      /* Padrão de Pontos (Dotted Grid) */
      background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 18px 18px;
      color: var(--text-main);
      padding: 20px;
      padding-bottom: 70px !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* IMAGEM DE FUNDO DO MENU */
    .menu-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(8, 8, 12, 0.8) 0%, rgba(8, 8, 12, 0.95) 100%),
                  url('https://images.unsplash.com/photo-1434030216411-0b793f4b4173?q=80&w=1920&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      z-index: -1;
      transition: opacity 0.5s ease;
    }

    .container {
      width: 100%;
      max-width: 720px;
      z-index: 1;
    }

    /* Dashboard Superior */
    .dashboard {
      background: rgba(17, 17, 22, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .stat-item { text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text-main); }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

    /* CARTÃO DO MENU E FILTRO */
    .card-hero {
      background: rgba(17, 17, 22, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .menu-badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid var(--primary);
      color: #a5b4fc;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .title-select { font-size: 1.6rem; margin-bottom: 8px; font-weight: 800; color: #ffffff; }
    .subtitle-select { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px; }

    .discipline-grid { display: flex; flex-direction: column; gap: 12px; }

    .btn-discipline {
      background: rgba(26, 26, 36, 0.9);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.25s ease;
    }

    .btn-discipline:hover {
      background-color: #1e1e2c;
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .disc-content {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .disc-icon {
      width: 24px;
      height: 24px;
      fill: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Listagem de Filtros */
    .filter-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      max-height: 260px;
      overflow-y: auto;
      padding-right: 5px;
      text-align: left;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: var(--option-bg);
      border: 1px solid var(--card-border);
      padding: 14px 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    .filter-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* BARRA SUPERIOR DO FEED DE QUESTÕES */
    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    .btn-voltar {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-voltar:hover { color: var(--text-main); }

    /* CARTÃO DA QUESTÃO */
    .questao-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .questao-meta {
      font-size: 0.8rem;
      font-style: italic;
      color: #64748b;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .enunciado {
      font-size: 1.15rem;
      font-style: italic;
      font-weight: 700;
      line-height: 1.5;
      color: #ffffff;
      margin-bottom: 24px;
    }

    /* LISTA DE ALTERNATIVAS */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-item {
      display: flex;
      align-items: center;
      background-color: var(--option-bg);
      border: 1px solid var(--option-border);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .option-item:hover:not(.disabled) {
      border-color: #3f3f56;
      background-color: #1a1a24;
    }

    .letter-box {
      width: 36px;
      height: 36px;
      background-color: var(--letter-box-bg);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-right: 16px;
      flex-shrink: 0;
    }

    .option-text {
      flex-grow: 1;
      font-size: 1rem;
      color: var(--text-main);
      padding-right: 36px;
    }

    /* TESOURA SVG CUSTOMIZADA */
    .btn-tesoura {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all 0.2s;
      border-radius: 6px;
    }

    .btn-tesoura:hover {
      color: var(--danger);
      background-color: rgba(239, 68, 68, 0.1);
    }

    .btn-tesoura svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Estados da Opção */
    .option-item.selected {
      border-color: var(--primary);
      background-color: #1a1a2d;
    }

    .option-item.selected .letter-box {
      background-color: var(--primary);
      color: #ffffff;
    }

    .option-item.struck {
      opacity: 0.4;
    }

    .option-item.struck .option-text {
      text-decoration: line-through;
    }

    .option-item.correct {
      border-color: var(--success) !important;
      background-color: var(--success-bg) !important;
    }

    .option-item.correct .letter-box {
      background-color: var(--success);
      color: #ffffff;
    }

    .option-item.incorrect {
      border-color: var(--danger) !important;
      background-color: var(--danger-bg) !important;
    }

    .option-item.incorrect .letter-box {
      background-color: var(--danger);
      color: #ffffff;
    }

    /* Banner Feedback */
    .feedback-banner {
      display: none;
      padding: 14px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .feedback-banner.success { display: block; background-color: var(--success-bg); border: 1px solid var(--success); color: #86efac; }
    .feedback-banner.error { display: block; background-color: var(--danger-bg); border: 1px solid var(--danger); color: #fca5a5; }

    .q-actions {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary { background-color: var(--primary); color: #ffffff; }
    .btn-primary:hover { background-color: #4f46e5; }

    /* PAGINAÇÃO INFERIOR */
    .pagination-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 16px 20px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .page-info {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    strong { color: var(--accent-color); font-weight: 700; }

    /* LOADING CMD */
    .cmd-loader-container {
      background-color: #000000;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px 20px;
      width: 100%;
      max-width: 320px;
      margin: 30px auto;
      text-align: left;
      font-family: 'Consolas', monospace;
    }

    .cmd-line { font-size: 0.85rem; color: var(--text-main); display: flex; align-items: center; }
    .cmd-prompt { color: var(--green-cmd); margin-right: 6px; }
    .typing-text { overflow: hidden; white-space: nowrap; width: 0; animation: typewriter 0.9s steps(19) 0.1s forwards; }
    .cmd-cursor { width: 8px; height: 1.1em; background-color: var(--green-cmd); margin-left: 1px; animation: blink 0.5s infinite; }

    @keyframes typewriter { from { width: 0; } to { width: 100%; } }
    @keyframes blink { 50% { opacity: 0; } }

    /* RODAPÉ FIXED */
    .win-taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 45px;
      background-color: #ffffff;
      border-top: 1px solid #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.9rem;
      color: #777777;
      z-index: 1000;
    }

    .instagram-link { color: #0095f6; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .instagram-icon { width: 18px; height: 18px; fill: currentColor; }

    /* Ícones das disciplinas: conjunto vetorial uniforme e mais limpo */
    .disc-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.10);
      color: var(--primary);
      box-sizing: border-box;
      transition: transform 0.18s ease, background-color 0.18s ease;
    }
    .disc-icon svg {
      width: 23px;
      height: 23px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .disc-icon svg .solid {
      fill: currentColor;
      stroke: none;
    }
    .btn-discipline:hover .disc-icon {
      transform: translateY(-1px) scale(1.04);
      background: rgba(99, 102, 241, 0.17);
    }
  </style>
</head>
<body>

  <!-- IMAGEM DE FUNDO DO MENU -->
  <div class="menu-background" id="bg-imagem"></div>

  <div class="container">
    
    <!-- Dashboard Superior -->
    <div class="dashboard" id="dashboard-stats" style="display: none;">
      <div class="stat-item"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Respondidas</div></div>
      <div class="stat-item"><div class="stat-value" id="stat-acertos">0</div><div class="stat-label">Acertos</div></div>
      <div class="stat-item"><div class="stat-value" id="stat-pct">0%</div><div class="stat-label">Rendimento</div></div>
    </div>

    <!-- TELA 1: SELEÇÃO DE DISCIPLINAS COM ÍCONES VETORIAIS -->
    <div class="card-hero" id="tela-selecao">
      <span class="menu-badge">Simulados & Questões</span>
      <div class="title-select">Menu Principal</div>
      <div class="subtitle-select">Selecione uma matéria para iniciar o seu treino:</div>

      <div class="discipline-grid">
        <!-- Português (Coruja - Material Design) -->
        <button class="btn-discipline" onclick="abrirFiltroDisciplina('portugues', 'Língua Portuguesa')">
          <div class="disc-content">
            <span class="disc-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5V4.5Z"/><path d="M5 4.5V21.5"/><path d="M9 7h7M9 10.5h7M9 14h5"/></svg>
            </span>
            <span>Língua Portuguesa</span>
          </div>
          ➔
        </button>

        <!-- Direito (Balança da Justiça - Material Design) -->
        <button class="btn-discipline" onclick="abrirFiltroDisciplina('direito', 'Noções de Direito')">
          <div class="disc-content">
            <span class="disc-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v13"/><path d="M5 7h14"/><path d="M4 7l-3 6a4 4 0 0 0 6 0L4 7Z"/><path d="M20 7l-3 6a4 4 0 0 0 6 0l-3-6Z"/><path d="M8 20h8"/><path d="M10 17h4"/></svg>
            </span>
            <span>Noções de Direito</span>
          </div>
          ➔
        </button>

        <!-- Informática (Monitor & Comando - Material Design) -->
        <button class="btn-discipline" onclick="abrirFiltroDisciplina('informatica', 'Informática')">
          <div class="disc-content">
            <span class="disc-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M6.5 6.5h11"/></svg>
            </span>
            <span>Informática</span>
          </div>
          ➔
        </button>

        <!-- Matemática (Calculadora & Símbolos - Material Design) -->
        <button class="btn-discipline" onclick="abrirFiltroDisciplina('matematica', 'Matemática')">
          <div class="disc-content">
            <span class="disc-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8 6.5h8"/><path d="M8 10.5h2M12 10.5h2M16 10.5h0M8 14h2M12 14h2M16 14h0M8 17.5h2M12 17.5h2M16 17.5h0"/></svg>
            </span>
            <span>Matemática</span>
          </div>
          ➔
        </button>
      </div>
    </div>

    <!-- TELA 2: FILTRO DE ASSUNTOS -->
    <div class="card-hero" id="tela-filtro" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <div class="title-select" id="filtro-titulo-materia" style="font-size: 1.3rem;">Filtro de Assuntos</div>
        <button class="btn-voltar" onclick="voltarParaSelecao()">← Voltar</button>
      </div>
      <div class="subtitle-select">Marque os assuntos que deseja praticar:</div>

      <div class="filter-list" id="filter-options-container"></div>

      <button class="btn btn-primary" onclick="iniciarQuizComFiltro()" style="width: 100%;">Iniciar Simulado ➔</button>
    </div>

    <!-- TELA 3: FEED DE QUESTÕES (10 POR PÁGINA) -->
    <div id="tela-quiz" style="display: none;">
      
      <!-- CARREGANDO ESTILO CMD -->
      <div id="loading-spinner" class="cmd-loader-container">
        <div class="cmd-line">
          <span class="cmd-prompt">C:\></span>
          <span class="typing-text">carregando_questoes</span>
          <span class="cmd-cursor"></span>
        </div>
      </div>

      <div id="quiz-content" style="display: none;">
        <div class="feed-header">
          <span style="font-weight: 700; color: var(--text-muted);" id="feed-materia-tag">DISCIPLINA</span>
          <button class="btn-voltar" onclick="voltarParaFiltro()">← Mudar Filtros</button>
        </div>

        <!-- Onde as 10 questões da página serão renderizadas -->
        <div id="questoes-feed-container"></div>

        <!-- Paginação -->
        <div class="pagination-bar">
          <button class="btn btn-voltar" id="btn-page-prev" onclick="mudarPagina(-1)">← Página Anterior</button>
          <span class="page-info" id="page-info">Página 1 de 1</span>
          <button class="btn btn-primary" id="btn-page-next" onclick="mudarPagina(1)">Próxima Página →</button>
        </div>
      </div>

    </div>

  </div>

  <!-- RODAPÉ -->
  <footer class="win-taskbar">
    <div style="display: flex; align-items: center; gap: 6px;">
      <span>Desenvolvido por</span>
      <a href="https://www.instagram.com/luanm.aquino/" target="_blank" rel="noopener noreferrer" class="instagram-link">

      </a>
    </div>
  </footer>

  <script>
    let pastaDisciplinaAtual = "";
    let nomeDisciplinaAtual = "";
    let listaArquivosAssuntos = [];
    let bancoQuestoes = [];
    
    // Controle de Paginação (10 questões por página)
    let paginaAtual = 1;
    const QUESTOES_POR_PAGINA = 10;

    // Estado do usuário
    let respostasUsuario = {}; // { idQuestao: { selecionada: null, respondida: false, riscadas: [] } }
    let totalRespondidas = 0;
    let totalAcertos = 0;

    // SVG do ícone da Tesoura (Caminho corrigido e seguro - Material Design)
    const SVG_TESOURA = `
      <svg viewBox="0 0 24 24">
        <path d="M5.5,7A2.5,2.5 0 0,0 3,9.5A2.5,2.5 0 0,0 5.5,12A2.5,2.5 0 0,0 8,9.5A2.5,2.5 0 0,0 5.5,7M5.5,8.5A1,1 0 0,1 6.5,9.5A1,1 0 0,1 5.5,10.5A1,1 0 0,1 4.5,9.5A1,1 0 0,1 5.5,8.5M9.64,7.64C9.87,7.14 10,6.59 10,6A4,4 0 0,0 6,2A4,4 0 0,0 2,6A4,4 0 0,0 6,10C6.59,10 7.14,9.87 7.64,9.64L10,12L7.64,14.36C7.14,14.13 6.59,14 6,14A4,4 0 0,0 2,18A4,4 0 0,0 6,22A4,4 0 0,0 10,18C10,17.41 9.87,16.86 9.64,16.36L12,14L19,21H22V20L9.64,7.64M6,16A2,2 0 0,1 8,18A2,2 0 0,1 6,20A2,2 0 0,1 4,18A2,2 0 0,1 6,16M12,10L19,3H22V4L12,10Z"/>
      </svg>
    `;

    function formatarTexto(texto) {
      if (!texto) return '';
      return texto.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    }

    async function abrirFiltroDisciplina(pasta, nomeExibicao) {
      pastaDisciplinaAtual = pasta;
      nomeDisciplinaAtual = nomeExibicao;

      document.getElementById('filtro-titulo-materia').textContent = nomeExibicao;

      try {
        const respLista = await fetch(`questoes/${pasta}/lista.json`);
        if (!respLista.ok) throw new Error("Não foi possível carregar a lista de assuntos desta matéria.");

        listaArquivosAssuntos = await respLista.json();

        const container = document.getElementById('filter-options-container');
        container.innerHTML = '';

        const itemTodos = document.createElement('label');
        itemTodos.className = 'filter-item';
        itemTodos.innerHTML = `
          <input type="checkbox" id="chk-todos" checked onchange="toggleTodosAssuntos(this)">
          <strong>Todos os Assuntos</strong>
        `;
        container.appendChild(itemTodos);

        listaArquivosAssuntos.forEach(arq => {
          const nomeAssunto = arq.replace('.txt', '');
          const item = document.createElement('label');
          item.className = 'filter-item';
          item.innerHTML = `
            <input type="checkbox" class="chk-assunto" value="${arq}" checked onchange="verificarSelecaoFiltros()">
            <span>${nomeAssunto}</span>
          `;
          container.appendChild(item);
        });

        document.getElementById('tela-selecao').style.display = 'none';
        document.getElementById('tela-filtro').style.display = 'block';

      } catch (err) {
        alert("Atenção: " + err.message + "\n\nCrie a pasta 'questoes/" + pasta + "' e adicione o arquivo 'lista.json'.");
      }
    }

    function toggleTodosAssuntos(mainChk) {
      const chks = document.querySelectorAll('.chk-assunto');
      chks.forEach(c => c.checked = mainChk.checked);
    }

    function verificarSelecaoFiltros() {
      const chks = document.querySelectorAll('.chk-assunto');
      const todosMarcados = Array.from(chks).every(c => c.checked);
      document.getElementById('chk-todos').checked = todosMarcados;
    }

    async function iniciarQuizComFiltro() {
      const chks = document.querySelectorAll('.chk-assunto:checked');
      const arquivosSelecionados = Array.from(chks).map(c => c.value);

      if (arquivosSelecionados.length === 0) {
        alert("Selecione pelo menos um assunto para continuar!");
        return;
      }

      bancoQuestoes = [];
      respostasUsuario = {};

      document.getElementById('tela-filtro').style.display = 'none';
      document.getElementById('bg-imagem').style.opacity = '0';
      document.getElementById('tela-quiz').style.display = 'block';
      document.getElementById('loading-spinner').style.display = 'block';
      document.getElementById('quiz-content').style.display = 'none';

      try {
        let idGlobal = 0;
        for (const arq of arquivosSelecionados) {
          const respTxt = await fetch(`questoes/${pastaDisciplinaAtual}/${arq}`);
          if (respTxt.ok) {
            const texto = await respTxt.text();
            const assuntoDoArquivo = arq.replace('.txt', '');
            const questoesDoArquivo = parseTXT(texto, assuntoDoArquivo);
            
            questoesDoArquivo.forEach(q => {
              idGlobal++;
              q.globalId = idGlobal;
              bancoQuestoes.push(q);
              respostasUsuario[idGlobal] = { selecionada: null, respondida: false, riscadas: [] };
            });
          }
        }

        if (bancoQuestoes.length > 0) {
          embaralharArray(bancoQuestoes);
          paginaAtual = 1;

          setTimeout(() => {
            document.getElementById('loading-spinner').style.display = 'none';
            document.getElementById('quiz-content').style.display = 'block';
            document.getElementById('dashboard-stats').style.display = 'flex';
            document.getElementById('feed-materia-tag').textContent = nomeDisciplinaAtual.toUpperCase();
            renderizarPagina();
          }, 1000);

        } else {
          alert("Nenhuma questão encontrada nos arquivos selecionados.");
          voltarParaFiltro();
        }
      } catch (err) {
        alert("Erro ao carregar questões: " + err.message);
        voltarParaFiltro();
      }
    }

    function embaralharArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function parseTXT(texto, assunto) {
      const blocos = texto.split('---').map(b => b.trim()).filter(b => b.length > 0);
      const mapaLetras = { 'A': 0, 'B': 1, 'C': 2, 'D': 3, 'E': 4 };

      return blocos.map(bloco => {
        const linhas = bloco.split('\n');
        let enunciado = "";
        let alternativas = [];
        let correta = 0;
        let explicacao = "Sem explicação cadastrada.";

        linhas.forEach(linha => {
          const l = linha.trim();
          if (l.startsWith('ENUNCIADO:')) {
            enunciado = l.replace('ENUNCIADO:', '').trim();
          } else if (l.match(/^[A-E]\)/)) {
            alternativas.push(l.replace(/^[A-E]\)/, '').trim());
          } else if (l.startsWith('CORRETA:')) {
            const letra = l.replace('CORRETA:', '').trim().toUpperCase();
            correta = mapaLetras[letra] !== undefined ? mapaLetras[letra] : 0;
          } else if (l.startsWith('EXPLICACAO:')) {
            explicacao = l.replace('EXPLICACAO:', '').trim();
          }
        });

        return { disciplina: nomeDisciplinaAtual, assunto, enunciado, alternativas, correta, explicacao };
      });
    }

    /* RENDERIZAÇÃO DAS 10 QUESTÕES POR PÁGINA */
    function renderizarPagina() {
      const container = document.getElementById('questoes-feed-container');
      container.innerHTML = '';

      const totalPaginas = Math.ceil(bancoQuestoes.length / QUESTOES_POR_PAGINA);
      const inicio = (paginaAtual - 1) * QUESTOES_POR_PAGINA;
      const fim = Math.min(inicio + QUESTOES_POR_PAGINA, bancoQuestoes.length);

      const questoesDaPagina = bancoQuestoes.slice(inicio, fim);

      questoesDaPagina.forEach((q, index) => {
        const numeroGlobal = inicio + index + 1;
        const estado = respostasUsuario[q.globalId];
        const letras = ['A', 'B', 'C', 'D', 'E'];

        const qCard = document.createElement('div');
        qCard.className = 'questao-card';
        qCard.id = `card-q-${q.globalId}`;

        let htmlAlternativas = '';
        q.alternativas.forEach((alt, idx) => {
          const foiRiscada = estado.riscadas.includes(idx);
          const foiSelecionada = estado.selecionada === idx;

          let classeOpt = 'option-item';
          if (foiRiscada) classeOpt += ' struck';
          if (foiSelecionada) classeOpt += ' selected';

          if (estado.respondida) {
            classeOpt += ' disabled';
            if (idx === q.correta) classeOpt += ' correct';
            else if (foiSelecionada && foiSelecionada !== q.correta) classeOpt += ' incorrect';
          }

          htmlAlternativas += `
            <div class="${classeOpt}" id="opt-${q.globalId}-${idx}">
              <div class="letter-box">${letras[idx]}</div>
              <div class="option-text" onclick="selecionarOpcao(${q.globalId}, ${idx})">${formatarTexto(alt)}</div>
              <button class="btn-tesoura" onclick="toggleRiscar(event, ${q.globalId}, ${idx})" title="Eliminar alternativa">
                ${SVG_TESOURA}
              </button>
            </div>
          `;
        });

        qCard.innerHTML = `
          <div class="questao-meta">${q.assunto.toUpperCase()} // ALVO ${numeroGlobal}</div>
          <div class="enunciado">${formatarTexto(q.enunciado)}</div>
          <div class="options-list">${htmlAlternativas}</div>
          <div class="feedback-banner" id="feedback-${q.globalId}"></div>
          <div class="q-actions">
            <button class="btn btn-primary" id="btn-conf-${q.globalId}" onclick="conferirResposta(${q.globalId})" ${estado.respondida ? 'style="display:none;"' : ''}>
              Conferir Resposta
            </button>
          </div>
        `;

        container.appendChild(qCard);

        if (estado.respondida) {
          exibirFeedbackSalvo(q);
        }
      });

      document.getElementById('page-info').textContent = `Página ${paginaAtual} de ${totalPaginas}`;
      document.getElementById('btn-page-prev').style.visibility = paginaAtual === 1 ? 'hidden' : 'visible';
      document.getElementById('btn-page-next').style.visibility = paginaAtual === totalPaginas ? 'hidden' : 'visible';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selecionarOpcao(globalId, idx) {
      const estado = respostasUsuario[globalId];
      if (estado.respondida) return;

      estado.selecionada = idx;

      const posRisco = estado.riscadas.indexOf(idx);
      if (posRisco > -1) estado.riscadas.splice(posRisco, 1);

      const card = document.getElementById(`card-q-${globalId}`);
      const opts = card.querySelectorAll('.option-item');
      opts.forEach((opt, index) => {
        opt.classList.remove('selected');
        if (estado.riscadas.includes(index)) opt.classList.add('struck');
        else opt.classList.remove('struck');
      });

      document.getElementById(`opt-${globalId}-${idx}`).classList.add('selected');
    }

    function toggleRiscar(event, globalId, idx) {
      event.stopPropagation();
      const estado = respostasUsuario[globalId];
      if (estado.respondida) return;

      const pos = estado.riscadas.indexOf(idx);
      if (pos > -1) {
        estado.riscadas.splice(pos, 1);
      } else {
        estado.riscadas.push(idx);
        if (estado.selecionada === idx) estado.selecionada = null;
      }

      const opt = document.getElementById(`opt-${globalId}-${idx}`);
      opt.classList.toggle('struck');
      opt.classList.remove('selected');
    }

    function conferirResposta(globalId) {
      const estado = respostasUsuario[globalId];
      if (estado.selecionada === null) {
        alert("Por favor, selecione uma alternativa antes de conferir!");
        return;
      }

      const q = bancoQuestoes.find(item => item.globalId === globalId);
      estado.respondida = true;

      totalRespondidas++;
      if (estado.selecionada === q.correta) totalAcertos++;

      atualizarEstatisticas();

      const optSelecionada = document.getElementById(`opt-${globalId}-${estado.selecionada}`);
      const optCorreta = document.getElementById(`opt-${globalId}-${q.correta}`);

      if (estado.selecionada === q.correta) {
        optSelecionada.classList.add('correct');
      } else {
        optSelecionada.classList.add('incorrect');
        optCorreta.classList.add('correct');
      }

      document.getElementById(`btn-conf-${globalId}`).style.display = 'none';
      exibirFeedbackSalvo(q);
    }

    function exibirFeedbackSalvo(q) {
      const estado = respostasUsuario[q.globalId];
      const feedbackEl = document.getElementById(`feedback-${q.globalId}`);

      if (estado.selecionada === q.correta) {
        feedbackEl.className = 'feedback-banner success';
        feedbackEl.innerHTML = `<strong>✅ Resposta Correta!</strong><br>${formatarTexto(q.explicacao)}`;
      } else {
        feedbackEl.className = 'feedback-banner error';
        feedbackEl.innerHTML = `<strong>❌ Resposta Incorreta.</strong><br>${formatarTexto(q.explicacao)}`;
      }
    }

    function mudarPagina(delta) {
      paginaAtual += delta;
      renderizarPagina();
    }

    function atualizarEstatisticas() {
      document.getElementById('stat-total').textContent = totalRespondidas;
      document.getElementById('stat-acertos').textContent = totalAcertos;
      const pct = totalRespondidas > 0 ? ((totalAcertos / totalRespondidas) * 100).toFixed(0) : 0;
      document.getElementById('stat-pct').textContent = `${pct}%`;
    }

    function voltarParaSelecao() {
      document.getElementById('dashboard-stats').style.display = 'none';
      document.getElementById('tela-filtro').style.display = 'none';
      document.getElementById('tela-quiz').style.display = 'none';
      document.getElementById('bg-imagem').style.opacity = '1';
      document.getElementById('tela-selecao').style.display = 'block';
    }

    function voltarParaFiltro() {
      document.getElementById('dashboard-stats').style.display = 'none';
      document.getElementById('tela-quiz').style.display = 'none';
      document.getElementById('bg-imagem').style.opacity = '1';
      document.getElementById('tela-filtro').style.display = 'block';
    }
  </script>
</body>
</html>
